<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food diary</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body{
            background-color: rgb(185, 185, 8);
            margin: 20px;
            padding: 20px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        blockquote{
            border-left: 4px solid brown;
            padding-left: 10px;
            font-style: italic;
            display: inline-block;
        }

        hr{
            border-color: chocolate;
        }
    </style>
</head>

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<body>

    <!--Topic:1 Display-->
    <p class="display-1">MY FOOD DIARY</p>
    <p class="display-2">TOP DISHES</p>
    <p class="display-3">FUN FOOD FACTS</p>
    <p class="display-4">FOOD GUIDE</p>

    <hr>

    <!--Topic:2 - Highlight text-->
    <h2>Did you know?</h2>
    <p>Pizza is the <mark>most popular</mark> food ordered by kids around the world.</p>

    <hr>

    <!--Topic:3 - Abbreviation-->
    <h2>Cooking style</h2>
    <p>My favorite way to cook with a family is a good old <abbr title="Barbeque">BBQ</abbr> pizza.</p>

    <hr>

    <!--Topic:4-Blockquote-->
    <h2>Food Quote</h2>
    <blockquote>
        <p>"First we eat, then we do everything else."</p>
        <p>-M.F.K Fisher</p>
    </blockquote>

</body>
</html>
