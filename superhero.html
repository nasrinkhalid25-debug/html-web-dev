<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thunder Kid | Top Hero</title>
    <style>
        * { box-sizing: border-box; }
        body {
            position: relative;
            min-height: 490px;
            margin: 0;
            padding: 2px 0 30px;
            overflow-x: hidden;
            background-color: #f5f5f5;
            color: black;
            font-family: monospace;
            font-size: 35px;
        }
        h1 {
            margin: 24px 0 36px;
            color: #ffdf00;
            font-size: min(16vw, 64px);
            line-height: 1.05;
            text-shadow: 2px 3px #cc8b00;
        }
        .tagline {
            margin: 0 0 17px;
            color: #c4d3ff;
            font-style: italic;
        }
        h2 {
            margin: 0 0 14px;
            color: #ff796c;
            font-size: 24px;
            line-height: 1.2;
            text-decoration: underline;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        li {
            margin-bottom: 13px;
            color: #8be58e;
            font-size: 16px;
            font-weight: bold;
        }
        .weaknesses {
            margin-top: 19px;
        }
        .weaknesses li {
            color: #7982bd;
            font-weight: normal;
            text-decoration: line-through;
        }
        .badge {
            position: absolute;
            top: 371px;
            left: 7px;
            color: #ffdf00;
            font-size: 26px;
            font-weight: bold;
            transform: rotate(13deg);
        }
        footer {
            position: absolute;
            right: 0;
            bottom: -2px;
            left: 0;
            color: #ff796c;
            font-style: italic;
        }
    </style>
</head>
<body>
    <main>
        <h1>Thunder Kid</h1>
        <p class="tagline">The Most Powerful Hero In The School</p>
        <section aria-labelledby="powers">
            <h2 id="powers">SUPER POWERS</h2>
            <ul>
                <li>Can run faster than a cheetah</li>
                <li>Can lift a school bus</li>
            </ul>
        </section>
        <section class="weaknesses" aria-labelledby="weaknesses">
            <h2 id="weaknesses">WEAKNESSES</h2>
            <ul>
                <li>Maths homework</li>
                <li>Broccoli</li>
            </ul>
        </section>
        <p class="badge">Top Hero</p>
    </main>
    <footer>Created by</footer>
</body>
</html>
